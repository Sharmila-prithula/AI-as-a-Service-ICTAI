apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-llama3-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-llama3
  template:
    metadata:
      labels:
        app: vllm-llama3
    spec:
      containers:
      - name: vllm-container
        image: vllm/vllm-openai:latest
        args:
          - "--model"
          - "/data/models/Llama-3.2-1B-Instruct" # Or your 8B model
          - "--host"
          - "0.0.0.0"
          - "--port"
          - "8000"
        resources:
          limits:
            nvidia.com/gpu: 1 # This is why we did all that work!
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: models-storage
          mountPath: /data/models
      volumes:
      - name: models-storage
        hostPath:
          path: /data/models
